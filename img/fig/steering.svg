<title id="fig-steer-t">Planar channeling and volume reflection in a bent crystal</title><desc id="fig-steer-d">A bent crystal is drawn as curved atomic planes. One particle enters parallel to the planes, oscillates between two of them and leaves deflected by the bending angle. A second particle enters at a larger angle, meets a plane tangentially inside the crystal and is reflected to the opposite side by a small angle.</desc>
