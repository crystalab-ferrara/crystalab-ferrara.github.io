<title id="fig-xray-t">A bent crystal analyser on the Rowland circle</title><desc id="fig-xray-d">Sample, curved crystal and detector lie on a circle, the Rowland circle. The crystal is bent to twice the circle radius, so X-rays from the sample reflected anywhere on its surface at the Bragg angle reach the detector.</desc>
