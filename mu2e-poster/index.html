<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Crystal Lab Ferrara posters in 70×100 cm black aluminium frames, in a walkable 3D corridor.">
<title>Crystal Lab Poster Corridor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: the 3D room fills the screen; one quiet control strip floats at the top, a hint line at the bottom. */
:root {
  --panel: rgba(255, 255, 255, .86);
  --ink: #1b1d22;
  --muted: #5b6474;
  --line: rgba(27, 29, 34, .14);
  --accent: #d62b25;
  --room: #eeeeec;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --panel: rgba(22, 24, 28, .84); --ink: #eef0f3; --muted: #a3abb8; --line: rgba(238, 240, 243, .16); color-scheme: dark } }
:root[data-theme="dark"] { --panel: rgba(22, 24, 28, .84); --ink: #eef0f3; --muted: #a3abb8; --line: rgba(238, 240, 243, .16); color-scheme: dark }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--room); color: var(--ink); font-family: var(--sans); overflow: hidden; }
#stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }
.bar {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  max-width: 980px; margin-inline: auto;
}
.id { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 260px; }
.id b { font-weight: 600; font-size: 15px; letter-spacing: .01em; }
.id b i { font-style: normal; color: var(--accent); }
.id span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.views { display: flex; flex-wrap: wrap; gap: 6px; }
.views button {
  font: 600 13px var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px; cursor: pointer;
}
.views button:hover { border-color: var(--ink); }
.views button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.views button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.id b em { font-style: normal; }
.seg { display: inline-flex; }
.views .seg button { border-radius: 0; }
.views .seg button:first-child { border-radius: 7px 0 0 7px; }
.views .seg button:last-child { border-radius: 0 7px 7px 0; margin-left: -1px; }
.pick select {
  font: 600 13px var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; cursor: pointer; max-width: 230px;
}
.pick select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pick option { color: #1b1d22; background: #fff; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* bottom dock: hint above, poster navigator below, within thumb reach on phones */
.dock {
  position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
}
.dock > * { pointer-events: auto; }
.hint {
  font-size: 12.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
  max-width: 100%; text-align: center; transition: opacity .6s;
}
.hint.gone { opacity: 0; pointer-events: none; }
.nav {
  display: flex; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: 100%;
}
.nav button { font: 600 14px var(--sans); color: var(--ink); background: transparent; border: 0; cursor: pointer; }
.nav #prev, .nav #next { width: 52px; font-size: 26px; line-height: 1; padding: 6px 0 9px; }
.nav #prev { border-right: 1px solid var(--line); } .nav #next { border-left: 1px solid var(--line); }
.nav button:hover { background: var(--line); }
.nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.here { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 6px 16px; min-width: 0; width: 290px; max-width: calc(100vw - 32px - 106px); }
.here span { font: 400 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.here b { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
#fade { position: fixed; inset: 0; background: #f2f2f0; opacity: 0; pointer-events: none; transition: opacity .2s; }
#fade.on { opacity: 1; }
#msg { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); pointer-events: none; }
@media (max-width: 640px) {
  .bar { gap: 8px; padding: 8px 10px; top: calc(8px + env(safe-area-inset-top, 0px)); }
  .id { flex-basis: 100%; }
  .id b { font-size: 13.5px; }
  .id span { display: none; }
  .views { gap: 5px; }
  .views button { padding: 7px 9px; font-size: 12.5px; }
  .hint { border-radius: 12px; font-size: 12px; }
  .pick select { max-width: 140px; padding: 7px 8px; font-size: 12.5px; }
  .nav #prev, .nav #next { width: 56px; }
}
</style>
</head>
<body>
<canvas id="stage" aria-label="Walkable 3D corridor with the Crystal Lab posters in black aluminium frames"></canvas>
<div id="msg">Caricamento della scena…</div>
<div id="fade"></div>
<div class="bar">
  <div class="id">
    <b>Crystal Lab posters <i>·</i> <em id="size-t">Nielsen Accent 70 × 100</em></b>
    <span id="size-s">piano terra blocco C · cornice 70 × 100 cm · A0 scalato a 70,7 × 100 cm</span>
  </div>
  <div class="views" role="group" aria-label="Viste">
    <button type="button" id="v-room" data-view="room" aria-pressed="true">Corridoio</button>
    <button type="button" id="v-plan" aria-pressed="false" title="Pianta del piano terra, vista dall'alto">Pianta</button>
    <div class="seg" role="group" aria-label="Formato dei poster">
      <button type="button" id="s-f70" aria-pressed="true" title="Cornice Nielsen 70 × 100, poster scalato">70 × 100</button>
      <button type="button" id="s-a0" aria-pressed="false" title="Poster A0 a grandezza reale, 84,1 × 118,9 cm">A0</button>
    </div>
    <div class="seg" role="group" aria-label="Disposizione dei poster">
      <button type="button" id="l-all" aria-pressed="true" title="Tutti gli 11 poster, uno tra ogni coppia di porte">Tutti</button>
      <button type="button" id="l-real" aria-pressed="false" title="BULLKID, simulazioni, Mu2e, tre posti vuoti, collimazione, OTELLO">Allestimento</button>
    </div>
    <label class="pick"><span class="sr">Vai al poster</span>
      <select id="pick" aria-label="Vai al poster"><option value="">Vai al poster…</option></select>
    </label>
  </div>
</div>
<div class="dock">
  <div class="hint">Trascina per ruotare · rotella o pizzico per zoomare · tasto destro o due dita per spostare</div>
  <nav class="nav" aria-label="Poster">
    <button type="button" id="prev" aria-label="Poster precedente">‹</button>
    <button type="button" id="here" class="here"><span id="here-n">–</span><b id="here-t">Corridoio</b></button>
    <button type="button" id="next" aria-label="Poster successivo">›</button>
  </nav>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">

import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('stage'), msg = document.getElementById('msg');
const r = new THREE.WebGLRenderer({ canvas, antialias: true });

const scene = new THREE.Scene();

const pm = new THREE.PMREMGenerator(r);

// units: mm. Poster wall = plane z = 0, floor y = 0, poster centre 1500 mm above the floor.
const CY = 1500;
let seed = 11; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

// The whole ground floor of block C, from the building plan (82.6 mm per plan pixel: small offices 3 × 3.6 m), corridors 2.4 m.

const XL = PX(120), XS = PX(104), XN = -40029;                                  // lifts / hall B boundary, stair north edge, north outer wall
const ZL = PZ(486), ZW = 5621, ZO = 8500, ER = EX1 + 6120, NR = -3720;          // lifts west of z = ZL, stair east wall, west outer wall, Est south rooms, Nord east rooms
const XM = (XE + XF) / 2;

  std:  { W: 900, H: 2100, F: 50, leaves: 1, fire: false },
  lab:  { W: 900, H: 2150, F: 60, leaves: 1, fire: true },
  fire: { W: 1200, H: 2150, F: 60, leaves: 1, fire: true },
  stair:{ W: 1400, H: 2150, F: 60, leaves: 2, fire: true },
  end:  { W: 1800, H: 2150, F: 60, leaves: 2, fire: true },
  lift: { W: 900, H: 2100, F: 60, leaves: 2, fire: false, lift: true },

const opening = t => ({ w: DOOR[t].W + 2 * DOOR[t].F, h: DOOR[t].H + DOOR[t].F });

// materials
const white = new THREE.MeshStandardMaterial({ color: 0xf6f6f4, roughness: 0.95 });
const cap = new THREE.MeshStandardMaterial({ color: 0x55595f, roughness: 0.9 });         // wall tops, seen from the plan view
const wallMats = [white, white, cap, white, white, white];
const yellow = new THREE.MeshStandardMaterial({ color: 0xf0b31a, roughness: 0.42 });
const grey = new THREE.MeshStandardMaterial({ color: 0x8d9096, metalness: 0.35, roughness: 0.45 });
const steel = new THREE.MeshStandardMaterial({ color: 0xb8bcc2, metalness: 0.9, roughness: 0.32 });
const darkSteel = new THREE.MeshStandardMaterial({ color: 0x4a4e55, metalness: 0.7, roughness: 0.45 });

const box = (grp, w, h, d, mat, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); grp.add(m); return m; };
const ceilGrp = new THREE.Group(), labelGrp = new THREE.Group(); scene.add(ceilGrp, labelGrp); labelGrp.visible = false;

// text on a small canvas (room plates, plan labels)
function textTex(txt, w, h, { bg = '#ffffff', fg = '#1b1d22', font = 600, size = 0.62 } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); } g.fillStyle = fg; g.font = `${font} ${Math.round(h * size)}px "IBM Plex Sans", system-ui, sans-serif`;
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, w / 2, h / 2 + h * 0.03);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;

// walls: boxes along x (wallX: fixed z) or z (wallZ: fixed x), with door holes {c, w, h}; f = face, s = side the body goes (+1/-1), t = thickness
function run(a, b, holes, mk) {
  let u = a; for (const { c, w, h } of [...holes].sort((p, q) => p.c - q.c)) {
    const h0 = c - w / 2, h1 = c + w / 2; if (h0 > u) mk(u, h0, 0, CH); mk(h0, h1, h, CH); u = h1;
  } if (b > u) mk(u, b, 0, CH);
}
function wallX(f, s, t, x0, x1, holes = []) {
  run(x0, x1, holes, (a, b, y0, y1) => { if (b - a < 1 || y1 - y0 < 1) return; const m = new THREE.Mesh(new THREE.BoxGeometry(b - a, y1 - y0, t), wallMats); m.position.set((a + b) / 2, (y0 + y1) / 2, f + s * t / 2); scene.add(m); });

function wallZ(f, s, t, z0, z1, holes = []) {

// a door; dir = direction from the wall towards the side it is seen from ('+z', '-z', '+x', '-x'); open: leaves swung back 85°
const ROT = { '+z': 0, '-z': Math.PI, '+x': Math.PI / 2, '-x': -Math.PI / 2 };
function door(x, z, dir, type, { open = false, label = '' } = {}) {
  const { W, H, F, leaves, fire, lift } = DOOR[type], OWd = W + 2 * F, OHd = H + F;
  const grp = new THREE.Group(); grp.position.set(x, 0, z); grp.rotation.y = ROT[dir]; scene.add(grp);

  const lw = W / leaves;

      box(P, 320, 55, 55, steel, o + hinge * (lw / 2 - 230), H - 70, 33);
      box(P, 200, 200, 2, plate, o, 1650, 9); box(P, 170, 20, 2.5, red, o, 1720, 9.5);
    } else if (!lift) {
      box(P, 50, 130, 12, steel, o - hinge * (lw / 2 - 75), 1050, 11);
      box(P, 130, 18, 18, steel, o - hinge * (lw / 2 - 125), 1080, 35);
    }
  }

    const m = new THREE.Mesh(new THREE.PlaneGeometry(170, 80), new THREE.MeshStandardMaterial({ map: textTex(label, 256, 120), roughness: 0.5 }));

}
const H = t => ({ w: opening(t).w, h: opening(t).h });

// ---------- Ala Nord ----------
const nordRight = [...Array(11)].map((_, k) => ({ c: 4500 - 3000 * k, t: 'std', label: String(k + 1).padStart(3, '0') }));
const nordLeft = [{ c: PX(536), t: 'stair', label: 'Scala' }, { c: 1700, t: 'lab', label: '012' }];
[[-3700, '012', '013'], [-9700, '013', '014'], [-15700, '014', '015'], [-21700, '015', '016']].forEach(([p, a, b]) => nordLeft.push({ c: p + 560, t: 'lab', label: a }, { c: p - 560, t: 'lab', label: b }));
nordLeft.push({ c: -26000, t: 'lab', label: '016' });
// hub east side doors share the z = 0 wall with the Ala Nord right wall
const eastHub = [{ c: (EX0 + EX1) / 2, t: 'std', label: '000', dir: '+z' }, { c: PX(135), t: 'std', label: '', dir: '+z' }];

nordRight.forEach(d => door(d.c, 0, '+z', d.t, { label: d.label }));
eastHub.forEach(d => door(d.c, 0, '+z', d.t, { label: d.label }));
wallX(CW, 1, 150, XF, XE, nordLeft.map(d => ({ c: d.c, ...H(d.t) })));
nordLeft.forEach(d => door(d.c, CW, '-z', d.t, { label: d.label }));

wallX(NR, -1, 300, XN - 300, XE + 200);                                           // outer walls
wallX(ZO, 1, 300, EX1, XE + 200);

wallX(0, -1, 150, XE + 200, XE + 2400); wallX(CW, 1, 150, XE + 200, XE + 2400); wallZ(XE + 2400, 1, 200, -150, CW + 150);

// ---------- hub: hall A (C0E side), strip, hall B (C0N side), lifts, stairs, room 000, services ----------
const lifts = [3060, 4740];
wallZ(EX1, 1, 150, 0, EZ0, [{ c: ZL / 2, w: ZL - 300, h: 2300 }, ...lifts.map(c => ({ c, ...H('lift') })), { c: (ZW + ZO) / 2, w: ZO - ZW - 300, h: 2400 }]);
lifts.forEach(c => door(EX1, c, '-x', 'lift'));
wallX(ZL, 1, 150, EX1, XL);                                                       // lift shafts: strip side
wallZ(XL, -1, 150, ZL, ZW);                                                       // lift shafts: hall B side
wallX((lifts[0] + lifts[1]) / 2 - 50, 1, 100, EX1 + 150, XL);                     // between the two shafts
wallX(ZW, 1, 150, EX1, XF);                                                       // stair / lifts west wall towards hall B
for (const x of [-33826, PX(125)]) wallZ(x - 50, 1, 100, NR, -150);               // 000 | room | room partitions
// stairs: a flight going up from the landing, a half landing, a second flight
{
  const st = new THREE.Group(); scene.add(st); const sm = new THREE.MeshStandardMaterial({ color: 0xbfc2c4, roughness: 0.6 });
  const n = 9, tr = 280, rise = 165, w = (ZO - ZW - 300) / 2;
  for (let i = 0; i < n; i++) box(st, tr, rise * (i + 1), w, sm, XS + 300 + tr * (i + 0.5), rise * (i + 1) / 2, ZO - w / 2 - 50);
  box(st, 900, rise * n, ZO - ZW - 200, sm, XS + 300 + tr * n + 450, rise * n / 2, (ZO + ZW) / 2);
  for (let i = 0; i < n; i++) box(st, tr, rise * (n + i + 1), w, sm, XS + 300 + tr * (n - i - 0.5), rise * (n + i + 1) / 2, ZW + w / 2 + 50);
  box(st, 40, 900, 40, steel, XS + 300, 1450, ZO - w - 60);
}
// hall A north wall (also Ala Est north wall) and room 000
const estNorth = [[23, '030'], [61.5, '029'], [96.5, '028'], [132.5, '027'], [168.5, '026'], [204.5, '025'], [241, '024'], [277.5, '023'], [313.5, '022'], [349.8, '021a'], [385.5, '021b']].map(([x, l]) => ({ c: PZ(x), t: 'std', label: l }));
const hubNorth = [{ c: PZ(418), t: 'std', label: 'WC' }, { c: 1100, t: 'std', label: '' }];
wallZ(EX0, -1, 150, 0, EZ1, [...estNorth, ...hubNorth].map(d => ({ c: d.c, ...H(d.t) })));
[...estNorth, ...hubNorth].forEach(d => door(EX0, d.c, '+x', d.t, { label: d.label }));
wallZ(XN, -1, 300, NR - 300, EZ1 + 300);                                         // north outer wall

function setSize(k, keepView) {

  for (const p of ALL) { for (const g of Object.values(p.sub)) p.G.remove(g); p.G.add(p.sub[k]); }
  document.getElementById('size-t').textContent = SIZES[k].title;
  document.getElementById('size-s').textContent = 'piano terra blocco C · ' + SIZES[k].sub;
  for (const id of ['f70', 'a0']) document.getElementById('s-' + id).setAttribute('aria-pressed', String(id === k));
  try { localStorage.setItem('poster-size', k); } catch (e) {}
  if (keepView && current >= 0) goPoster(current);
}
document.getElementById('s-f70').addEventListener('click', () => setSize('f70', true));
document.getElementById('s-a0').addEventListener('click', () => setSize('a0', true));
setSize(SIZE);
// layout: which posters hang and where; the view stays on the poster you were looking at if it is still there
function setLayout(k, keepView) {
  if (!LAYOUTS[k]) return; LAYOUT = k;
  const was = current >= 0 ? POSTERS[current] : null;
  for (const p of ALL) scene.remove(p.G);
  POSTERS = LAYOUTS[k].map(([id, x]) => { const p = ALL.find(q => q.id === id); p.x = x; p.G.position.x = x; scene.add(p.G); return p; });
  pick.length = 1;
  POSTERS.forEach((p, i) => { const o = document.createElement('option'); o.value = String(i); o.textContent = `${i + 1}. ${TITLES[p.id]}`; pick.append(o); });
  for (const id of ['all', 'real']) document.getElementById('l-' + id).setAttribute('aria-pressed', String(id === k));
  try { localStorage.setItem('poster-layout', k); } catch (e) {}
  current = was ? POSTERS.indexOf(was) : -1;
  if (keepView && current >= 0) goPoster(current); else label();
}
document.getElementById('l-all').addEventListener('click', () => { hideHintSoon(); setLayout('all', true); });
document.getElementById('l-real').addEventListener('click', () => { hideHintSoon(); setLayout('real', true); });
setLayout(LAYOUT);
const userMoved = () => { if (anim) { goal.copy(pos); gYaw = yaw; gPitch = pitch; anim = null; } };

// what is under a screen point
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hitAt(cx, cy) {
  const rc = canvas.getBoundingClientRect(); ndc.set((cx - rc.left) / rc.width * 2 - 1, -(cy - rc.top) / rc.height * 2 + 1);
  cam.updateMatrixWorld(); ray.setFromCamera(ndc, cam);
  return ray.intersectObjects(scene.children, true).find(h => h.object.isMesh && h.face) || null;
}
// move along the ray through a screen point: f > 0 towards the surface (never closer than 7 cm), f < 0 away
function dolly(cx, cy, f) {
  userMoved();
  const h = hitAt(cx, cy), d = h ? h.distance : 4000, dir = ray.ray.direction.clone();
  goal.addScaledVector(dir, f > 0 ? Math.min(f * d, Math.max(0, d - 70)) : f * Math.max(d, 700)); clampP(goal);
}
// click or tap: on a poster, first stand in front of it, then a closer look at the clicked spot; on the floor walk there;
// on a wall or door stand 1.3 m off it
function goThere(cx, cy) {
  const h = hitAt(cx, cy); if (!h) return;
  if (plan) {
    const p = new THREE.Vector3(h.point.x, 1600, h.point.z); setPlan(false); clampP(p);
    const ahead = p.clone().add(new THREE.Vector3(-Math.sin(gYaw) * 1000, 0, -Math.cos(gYaw) * 1000));
    pos.copy(p); goal.copy(p); placeLights(pos); return;
  }
  const n = h.face.normal.clone().transformDirection(h.object.matrixWorld);
  let poster = null; for (let o = h.object; o; o = o.parent) if (o.userData.poster) poster = o;
  if (poster) {
    const i = POSTERS.findIndex(p => p.G === poster), p = POSTERS[i];
    const inFront = Math.abs(pos.x - p.x) < 400 && pos.z < frontDist() + 150 && Math.abs(Math.sin(yaw)) < 0.35;
    if (!inFront) { goPoster(i); return; }
    current = i; label();
    const d = clamp(h.distance * 0.45, 260, 900);
    flyTo(new THREE.Vector3(h.point.x, h.point.y, d), new THREE.Vector3(h.point.x, h.point.y, 0)); return;
  }
  if (n.y > 0.7) { const p = new THREE.Vector3(h.point.x, 1600, h.point.z); flyTo(p, p.clone().add(new THREE.Vector3(-Math.sin(gYaw) * 1000, 0, -Math.cos(gYaw) * 1000))); return; }
  if (n.y < -0.7) return;
  const p = h.point.clone().addScaledVector(n, 1300); p.y = clamp(h.point.y, 1450, 1750);
  flyTo(p, h.point);
}

// pointer input: drag = look, right/shift-drag = sidestep, pinch = move, two-finger drag = sidestep, click/tap = go
const pts = new Map(); let mode = null, last = null, pinch = null, press0 = null;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  hideHintSoon();
  if (pts.size === 1) {
    mode = (e.button === 2 || e.shiftKey) ? 'pan' : 'look'; last = { x: e.clientX, y: e.clientY }; panScale(e.clientX, e.clientY);
    press0 = (e.button === 0) ? { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 } : null;
  }
  if (pts.size === 2) { mode = 'pinch'; pinch = pinchState(); panScale(pinch.mx, pinch.my); press0 = null; }
});
let pscale = 1;
function panScale(cx, cy) { const h = hitAt(cx, cy), d = h ? h.distance : 3000; pscale = d * 2 * Math.tan(cam.fov * Math.PI / 360) / canvas.clientHeight; }
function pinchState() { const [a, b] = [...pts.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; }
function pan(dx, dy) {
  userMoved();
  const right = new THREE.Vector3(Math.cos(gYaw), 0, -Math.sin(gYaw));
  if (plan) { const fw = new THREE.Vector3(-Math.sin(gYaw), 0, -Math.cos(gYaw)); goal.addScaledVector(right, -dx * pscale); goal.addScaledVector(fw, dy * pscale); clampP(goal); return; }
  goal.addScaledVector(right, -dx * pscale); goal.y += dy * pscale; clampP(goal);
}
canvas.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (mode === 'look' || mode === 'pan') {
    const dx = e.clientX - last.x, dy = e.clientY - last.y; last = { x: e.clientX, y: e.clientY };
    if (press0) press0.moved += Math.abs(dx) + Math.abs(dy);
    if (press0 && press0.moved < 8) return;                                     // still a click
    if (mode === 'pan' || plan) { pan(dx, dy); return; }
    userMoved();
    const k = cam.fov * Math.PI / 180 / canvas.clientHeight;                   // the scene follows the pointer
    gYaw += dx * k; gPitch = clamp(gPitch + dy * k, -1.25, 1.25);
  } else if (mode === 'pinch' && pts.size === 2) {
    const s = pinchState();
    dolly(s.mx, s.my, Math.log(s.d / pinch.d) * 1.6);
    pan(s.mx - pinch.mx, s.my - pinch.my);
    pinch = s;
  }
});
const up = e => {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (e.type === 'pointerup' && pts.size === 0 && press0 && press0.moved < 8 && performance.now() - press0.t < 450 && mode === 'look') goThere(e.clientX, e.clientY);
  press0 = null;
  if (pts.size === 1) { mode = 'look'; const [p] = pts.values(); last = { ...p }; }
  if (pts.size === 0) mode = null;
};
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', e => {
  e.preventDefault(); hideHintSoon();
  const dy = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
  dolly(e.clientX, e.clientY, clamp(-dy * 0.0016, -0.45, 0.4));
}, { passive: false });
// keyboard: WASD / arrows walk and turn (shift = faster); N, P, PageDown, PageUp = next / previous poster; Home = corridor
const keys = new Set();
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('select')) return;
  if (e.code === 'KeyN' || e.code === 'PageDown') { e.preventDefault(); step(1); return; }
  if (e.code === 'KeyP' || e.code === 'PageUp') { e.preventDefault(); step(-1); return; }
  if (e.code === 'Home') { e.preventDefault(); overview(); return; }
  if (e.code === 'KeyM') { e.preventDefault(); setPlan(!plan); return; }
  if (/^(Key[WASD]|Arrow\w+|ShiftLeft|ShiftRight)$/.test(e.code)) { keys.add(e.code); if (e.code !== 'ShiftLeft' && e.code !== 'ShiftRight') { e.preventDefault(); userMoved(); hideHintSoon(); } }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

const hint = document.querySelector('.hint');
hint.textContent = TOUCH
  ? 'Tocca un poster per andarci, toccalo ancora per avvicinarti · un dito: guardati intorno · pizzica: avanza · ‹ › poster vicino'
  : 'Clic su un poster per andarci, ancora per avvicinarti · trascina: guardati intorno · rotella: avanza verso il cursore · WASD o frecce: cammina · N/P: poster';
let hintTimer = null; function hideHintSoon() { if (!hintTimer) hintTimer = setTimeout(() => hint.classList.add('gone'), 9000); }

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  r.setSize(w, h, false); cam.aspect = w / h; cam.fov = w / h < 0.9 ? 62 : 42; cam.updateProjectionMatrix();
}
addEventListener('resize', resize);


resize(); overview(true); placeLights(pos);
let lastT = performance.now(), lodT = 1;
const fwd = new THREE.Vector3(), side = new THREE.Vector3();
r.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (anim) {
    const k = Math.min(1, (now - anim.s) / anim.d), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    pos.lerpVectors(anim.p0, anim.p1, e); yaw = anim.y0 + (anim.y1 - anim.y0) * e; pitch = anim.q0 + (anim.q1 - anim.q0) * e;
    if (k === 1) { goal.copy(pos); gYaw = yaw; gPitch = pitch; anim = null; }
  } else {
    if (keys.size) {
      const sp = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 4500 : 1800) * dt * (plan ? 12 : 1);
      fwd.set(-Math.sin(gYaw), 0, -Math.cos(gYaw)); side.set(Math.cos(gYaw), 0, -Math.sin(gYaw));
      if (keys.has('KeyW') || keys.has('ArrowUp')) goal.addScaledVector(fwd, sp);
      if (keys.has('KeyS') || keys.has('ArrowDown')) goal.addScaledVector(fwd, -sp);
      if (keys.has('KeyD')) goal.addScaledVector(side, sp);
      if (keys.has('KeyA')) goal.addScaledVector(side, -sp);
      if (keys.has('ArrowLeft')) gYaw += 1.5 * dt;
      if (keys.has('ArrowRight')) gYaw -= 1.5 * dt;
      clampP(goal);
    }
    const a = 1 - Math.exp(-dt * 12);
    pos.lerp(goal, a); yaw += (gYaw - yaw) * a; pitch += (gPitch - pitch) * a;
  }
  cam.position.copy(pos); cam.rotation.set(pitch, yaw, 0);
  if ((lodT += dt) > 0.3) { lodT = 0; levelOfDetail(); follow(); if (!plan) placeLights(pos); }
  r.render(scene, cam);
});
</script>
</body>
</html>
