<style>
/* Layout: the 3D room fills the screen; one quiet control strip floats at the top, a hint line at the bottom. */

:root[data-theme="dark"] { --panel: rgba(22, 24, 28, .84); --ink: #eef0f3; --muted: #a3abb8; --line: rgba(238, 240, 243, .16); color-scheme: dark }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }

  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  max-width: 980px; margin-inline: auto;
}
.id { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 260px; }
.id b { font-weight: 600; font-size: 15px; letter-spacing: .01em; }
.id b i { font-style: normal; color: var(--accent); }
.id span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.views { display: flex; flex-wrap: wrap; gap: 6px; }
.views button {
  font: 600 13px var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px; cursor: pointer;
}
.views button:hover { border-color: var(--ink); }
.views button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.views button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint {
  position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  font-size: 12.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; white-space: nowrap;
  max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
}
#msg { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); pointer-events: none; }
@media (max-width: 640px) {
  .bar { gap: 8px; padding: 8px 10px; top: calc(8px + env(safe-area-inset-top, 0px)); }
  .id { flex-basis: 100%; }
  .id b { font-size: 13.5px; }
  .id span { display: none; }
  .views { gap: 5px; }
  .views button { padding: 7px 9px; font-size: 12.5px; }
  .hint { white-space: normal; text-align: center; border-radius: 12px; width: max-content; font-size: 12px; }
}
</style>
</head>

const VIEWS = {
  room:   { pos: [XE - 400, 1650, 2150],                 tgt: [0, 1480, 0] },
  near:   { pos: [1750, 1600, 2500],                     tgt: [0, 1480, 0] },
  front:  { pos: [0, CY, 2850],                          tgt: [0, CY, 0] },
  corner: { pos: [OW / 2 + 230, CY + OH / 2 + 110, 300], tgt: [OW / 2 - 60, CY + OH / 2 - 80, DEPTH] },
  text:   { pos: [-120, CY + 300, 640],                  tgt: [-120, CY + 300, DEPTH] },
  entry:  { pos: [-6000, 1650, 1500],                    tgt: [XE, 1250, CW / 2] },
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const press = name => document.querySelectorAll('.views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
function flyTo(p1, look, dur = 900) {
  clampP(p1);
  let [y1, p1a] = look ? angles(p1, look) : [gYaw, gPitch];
  y1 = near(y1, yaw);
  if (reduce || dur === 0) { pos.copy(p1); goal.copy(p1); yaw = gYaw = y1; pitch = gPitch = p1a; anim = null; return; }
  anim = { p0: pos.clone(), p1, y0: yaw, y1, q0: pitch, q1: p1a, s: performance.now(), d: dur };
}
function go(name, instant) { const v = VIEWS[name]; if (!v) return; press(name); flyTo(new THREE.Vector3(...v.pos), new THREE.Vector3(...v.tgt), instant ? 0 : 900); }
document.querySelectorAll('.views button').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
const userMoved = () => { if (anim) { goal.copy(pos); gYaw = yaw; gPitch = pitch; anim = null; } press(''); };

// what is under a screen point
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hitAt(cx, cy) {
  const rc = canvas.getBoundingClientRect(); ndc.set((cx - rc.left) / rc.width * 2 - 1, -(cy - rc.top) / rc.height * 2 + 1);
  cam.updateMatrixWorld(); ray.setFromCamera(ndc, cam);
  return ray.intersectObjects(scene.children, true).find(h => h.object.isMesh && h.face) || null;
}
// move along the ray through a screen point: f > 0 towards the surface (never closer than 7 cm), f < 0 away
function dolly(cx, cy, f) {
  userMoved();
  const h = hitAt(cx, cy), d = h ? h.distance : 4000, dir = ray.ray.direction.clone();
  goal.addScaledVector(dir, f > 0 ? Math.min(f * d, Math.max(0, d - 70)) : f * Math.max(d, 700)); clampP(goal);
}
// go to the point: on the floor walk there at eye height; on the poster stand in front of it; on a wall or door stand 1.3 m off
function goThere(cx, cy) {
  const h = hitAt(cx, cy); if (!h) return;
  const n = h.face.normal.clone().transformDirection(h.object.matrixWorld);
  let onPoster = false; for (let o = h.object; o; o = o.parent) if (o.userData.poster) onPoster = true;
  press('');
  if (n.y > 0.7) { const p = new THREE.Vector3(h.point.x, 1600, h.point.z); flyTo(p, p.clone().add(new THREE.Vector3(-Math.sin(gYaw) * 1000, 0, -Math.cos(gYaw) * 1000))); return; }
  if (n.y < -0.7) return;
  const p = h.point.clone().addScaledVector(n, onPoster ? 700 : 1300); if (!onPoster) p.y = clamp(h.point.y, 1450, 1750);
  flyTo(p, h.point);
}

// pointer input
const pts = new Map(); let mode = null, last = null, pinch = null, tap = null;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  hideHintSoon();
  if (pts.size === 1) { mode = (e.button === 2 || e.shiftKey) ? 'pan' : 'look'; last = { x: e.clientX, y: e.clientY }; panScale(e.clientX, e.clientY); }
  if (pts.size === 2) { mode = 'pinch'; pinch = pinchState(); panScale(pinch.mx, pinch.my); }
  if (e.pointerType !== 'mouse' && pts.size === 1) {
    const now = performance.now();
    if (tap && now - tap.t < 320 && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < 30) { tap = null; goThere(e.clientX, e.clientY); mode = null; return; }
    tap = { t: now, x: e.clientX, y: e.clientY };
  }
});
let pscale = 1;
function panScale(cx, cy) { const h = hitAt(cx, cy), d = h ? h.distance : 3000; pscale = d * 2 * Math.tan(cam.fov * Math.PI / 360) / canvas.clientHeight; }
function pinchState() { const [a, b] = [...pts.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; }
function pan(dx, dy) {
  userMoved();
  const right = new THREE.Vector3(Math.cos(gYaw), 0, -Math.sin(gYaw));
  goal.addScaledVector(right, -dx * pscale); goal.y += dy * pscale; clampP(goal);
}
canvas.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (mode === 'look' || mode === 'pan') {
    const dx = e.clientX - last.x, dy = e.clientY - last.y; last = { x: e.clientX, y: e.clientY };
    if (Math.abs(dx) + Math.abs(dy) > 2) tap = null;
    if (mode === 'pan') { pan(dx, dy); return; }
    userMoved();
    const k = cam.fov * Math.PI / 180 / canvas.clientHeight;                   // the scene follows the pointer
    gYaw += dx * k; gPitch = clamp(gPitch + dy * k, -1.25, 1.25);
  } else if (mode === 'pinch' && pts.size === 2) {
    const s = pinchState();
    dolly(s.mx, s.my, Math.log(s.d / pinch.d) * 1.6);
    pan(s.mx - pinch.mx, s.my - pinch.my);
    pinch = s;
  }
});
const up = e => { pts.delete(e.pointerId); if (pts.size === 1) { mode = 'look'; const [p] = pts.values(); last = { ...p }; } if (pts.size === 0) mode = null; };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('dblclick', e => goThere(e.clientX, e.clientY));
canvas.addEventListener('wheel', e => {
  e.preventDefault(); hideHintSoon();
  const dy = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
  dolly(e.clientX, e.clientY, clamp(-dy * 0.0016, -0.45, 0.4));
}, { passive: false });
// keyboard walking
const keys = new Set();
addEventListener('keydown', e => { if (/^(Key[WASDQE]|Arrow\w+|ShiftLeft|ShiftRight)$/.test(e.code)) { keys.add(e.code); if (e.code.startsWith('Arrow') || e.code.startsWith('Key')) { e.preventDefault(); userMoved(); } } });
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

const hint = document.querySelector('.hint');
hint.textContent = TOUCH
  ? 'Un dito: guardati intorno · pizzica: avanza · due dita: spostati · doppio tocco: vai lì'
  : 'Trascina: guardati intorno · rotella: avanza verso il cursore · doppio clic: vai lì · WASD o frecce: cammina';
let hintTimer = null; function hideHintSoon() { if (!hintTimer) hintTimer = setTimeout(() => hint.hidden = true, 8000); }

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  r.setSize(w, h, false); cam.aspect = w / h; cam.fov = w / h < 0.9 ? 62 : 42; cam.updateProjectionMatrix();
}
addEventListener('resize', resize);


resize(); go('room', true);
let lastT = performance.now(), lodT = 1;
const fwd = new THREE.Vector3(), side = new THREE.Vector3();
r.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (anim) {
    const k = Math.min(1, (now - anim.s) / anim.d), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    pos.lerpVectors(anim.p0, anim.p1, e); yaw = anim.y0 + (anim.y1 - anim.y0) * e; pitch = anim.q0 + (anim.q1 - anim.q0) * e;
    if (k === 1) { goal.copy(pos); gYaw = yaw; gPitch = pitch; anim = null; }
  } else {
    if (keys.size) {
      const sp = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 4500 : 1800) * dt;
      fwd.set(-Math.sin(gYaw), 0, -Math.cos(gYaw)); side.set(Math.cos(gYaw), 0, -Math.sin(gYaw));
      if (keys.has('KeyW') || keys.has('ArrowUp')) goal.addScaledVector(fwd, sp);
      if (keys.has('KeyS') || keys.has('ArrowDown')) goal.addScaledVector(fwd, -sp);
      if (keys.has('KeyD')) goal.addScaledVector(side, sp);
      if (keys.has('KeyA')) goal.addScaledVector(side, -sp);
      if (keys.has('ArrowLeft')) gYaw += 1.5 * dt;
      if (keys.has('ArrowRight')) gYaw -= 1.5 * dt;
      clampP(goal);
    }
    const a = 1 - Math.exp(-dt * 12);
    pos.lerp(goal, a); yaw += (gYaw - yaw) * a; pitch += (gPitch - pitch) * a;
  }
  cam.position.copy(pos); cam.rotation.set(pitch, yaw, 0);
  if ((lodT += dt) > 0.3) { lodT = 0; levelOfDetail(); }
  r.render(scene, cam);
});
</script>
</body>
</html>
