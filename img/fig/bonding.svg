<title id="fig-bond-t">Anodic bonding of a crystal to a figured substrate</title><desc id="fig-bond-d">Left: a flat crystal plate above a glass substrate whose surface has been figured to the wanted curvature. Right: heated and under a voltage, with the crystal positive, sodium ions in the glass drift away from the interface, the surfaces are pulled together and bond, and the crystal takes the shape of the substrate.</desc>
