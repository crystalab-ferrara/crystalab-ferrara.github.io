<title id="fig-pot-t">Planar channeling in the continuous potential of the crystal planes</title><desc id="fig-pot-d">The transverse potential energy of a positive particle between atomic planes forms wells, highest at each plane. A particle whose transverse energy is below the well depth is trapped and oscillates inside one channel: it is channeled. One with more transverse energy crosses the planes: it is over the barrier.</desc>
