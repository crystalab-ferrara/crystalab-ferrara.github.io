<title>Crystal Lab Poster Corridor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>

:root[data-theme="dark"] { --panel: rgba(22, 24, 28, .84); --ink: #eef0f3; --muted: #a3abb8; --line: rgba(238, 240, 243, .16); color-scheme: dark }

<canvas id="stage" aria-label="Walkable 3D corridor with the Crystal Lab posters in black aluminium frames"></canvas>
<div id="msg">Caricamento della scena…</div>

  <div class="id">

    </div>
    <label class="pick"><span class="sr">Vai al poster</span>
      <select id="pick" aria-label="Vai al poster"><option value="">Vai al poster…</option></select>

  </div>
</div>
<div class="dock">
  <div class="hint">Trascina per ruotare · rotella o pizzico per zoomare · tasto destro o due dita per spostare</div>
  <nav class="nav" aria-label="Poster">

  </nav>
</div>

      const seam = new THREE.Mesh(seamGeo, seamMat); seam.position.set(sx * (S.OW / 2 - FACE / 2), sy * (S.OH / 2 - FACE / 2), DEPTH + 0.62); seam.rotation.z = sx * sy > 0 ? Math.PI / 4 : -Math.PI / 4; g.add(seam);
    }
    const back = new THREE.Mesh(S.back, backMat); back.position.z = (DEPTH - 6) / 2 - 0.5; g.add(back);
    const glass = new THREE.Mesh(S.glass, glassMat); glass.position.z = DEPTH - 2.5; g.add(glass);
    const sh = new THREE.Mesh(S.shadow, shadowMat); sh.position.set(0, -14, -GAP + 0.5); g.add(sh);
    const print = new THREE.Mesh(S.print, mat); print.position.z = DEPTH - 5; g.add(print);
  }
  G.add(sub[SIZE]);
  return { G, mat, sub };
}
// the group's posters, one between each pair of doors on the right wall; Mu2e between the 2nd and 3rd door (x = 0)
const POSTERS = [['channeling', 3000], ['mu2e', 0], ['collimation', -3000], ['positron', -6000], ['gamma', -9000], ['simulation', -12000], ['interferometry', -15000], ['bullkid', -18000]]
  .map(([id, x]) => ({ id, x, ...framedPoster(x), lo: null, hi: null, busy: false }));
const HI = TOUCH || r.capabilities.maxTextureSize < 8192 ? '4k' : '8k';
const loadImg = url => new Promise((res, rej) => { const im = new Image(); im.src = url; im.decode().then(() => res(im), rej); });
const texOf = im => { const t = new THREE.Texture(im); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = r.capabilities.getMaxAnisotropy(); t.needsUpdate = true; return t; };
POSTERS.forEach(p => loadImg(`${p.id}-2k.jpg`).then(im => {
  p.lo = texOf(im); if (!p.hi) { p.mat.map = p.lo; p.mat.needsUpdate = true; }
  if (p.id === 'mu2e') msg.hidden = true;
}).catch(() => { if (p.id === 'mu2e') msg.textContent = 'Immagine del poster non caricata: ricarica la pagina.'; }));
// sharp print when you come close (< 2.6 m), back to the light one when you walk away (> 5 m)
function levelOfDetail() {
  for (const p of POSTERS) {
    const d = Math.hypot(pos.x - p.x, pos.y - CY, pos.z);
    if (d < 2600 && !p.hi && !p.busy) {
      p.busy = true;
      loadImg(`${p.id}-${HI}.jpg`).then(im => { p.hi = texOf(im); p.mat.map = p.hi; p.mat.needsUpdate = true; }).catch(() => {}).finally(() => { p.busy = false; });
    } else if (d > 5000 && p.hi && !p.busy) {
      if (p.lo) { p.mat.map = p.lo; p.mat.needsUpdate = true; }
      p.hi.dispose(); p.hi = null;
    }
  }
}

// fill: diffuse light bounced by the white walls and ceiling
scene.add(new THREE.HemisphereLight(0xffffff, 0xd4d6d8, 0.75));
// camera and walking controls (first person, inside the corridor)
//   mouse: drag = look around · wheel = move towards / away from the point under the cursor · double-click = go there
//          right-drag or shift-drag = sidestep / up-down · WASD or arrows = walk (shift = faster)
//   touch: one finger = look around · pinch = move towards / away from the fingers · two-finger drag = sidestep · double-tap = go there
const cam = new THREE.PerspectiveCamera(42, 1, 5, 40000); cam.rotation.order = 'YXZ';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const clampP = p => { p.x = clamp(p.x, XF + 250, XE - 250); p.y = clamp(p.y, 200, CH - 150); p.z = clamp(p.z, 60, CW - 60); return p; };
const pos = new THREE.Vector3(), goal = new THREE.Vector3();
let yaw = 0, pitch = 0, gYaw = 0, gPitch = 0, anim = null;
const angles = (from, to) => { const d = to.clone().sub(from); return [Math.atan2(-d.x, -d.z), Math.atan2(d.y, Math.hypot(d.x, d.z))]; };
const near = (a, ref) => a + 2 * Math.PI * Math.round((ref - a) / (2 * Math.PI));     // same angle, closest to ref
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TITLES = { channeling: 'Channeling in crystals', mu2e: 'Crystals for Mu2e', collimation: 'Crystals for the LHC', positron: 'Crystals for positron sources',
  gamma: 'Crystals as γ-ray sources', simulation: 'Simulating coherent interactions', interferometry: 'Optical interferometry', bullkid: 'BULLKID-DM' };
const OVERVIEW = { pos: [XE - 400, 1650, CW - 250], tgt: [0, 1480, 0] };
function flyTo(p1, look, dur = 900) {
  clampP(p1);
  let [y1, p1a] = look ? angles(p1, look) : [gYaw, gPitch];
  y1 = near(y1, yaw);
  if (reduce || dur === 0) { pos.copy(p1); goal.copy(p1); yaw = gYaw = y1; pitch = gPitch = p1a; anim = null; return; }
  const d = clamp(p1.distanceTo(pos) / 6, 700, 1600);                            // longer walks take a little longer
  anim = { p0: pos.clone(), p1, y0: yaw, y1, q0: pitch, q1: p1a, s: performance.now(), d: dur === 900 ? d : dur };
}
// distance at which a whole framed poster fills the screen with a small margin
function frontDist() {
  const v = cam.fov * Math.PI / 360, h = Math.atan(Math.tan(v) * cam.aspect);
  return Math.min(CW - 120, Math.max(OH * 0.68 / Math.tan(v), OW * 0.6 / Math.tan(h)));
}
let current = -1;                                                                // poster the navigator points at (-1: overview)
function goPoster(i, instant) {
  i = (i + POSTERS.length) % POSTERS.length; current = i; const p = POSTERS[i];
  flyTo(new THREE.Vector3(p.x, CY, frontDist()), new THREE.Vector3(p.x, CY, 0), instant ? 0 : 900); label();
}
function overview(instant) { current = -1; flyTo(new THREE.Vector3(...OVERVIEW.pos), new THREE.Vector3(...OVERVIEW.tgt), instant ? 0 : 900); label(); }
const hereN = document.getElementById('here-n'), hereT = document.getElementById('here-t'), pick = document.getElementById('pick'), roomBtn = document.getElementById('v-room');
POSTERS.forEach((p, i) => { const o = document.createElement('option'); o.value = String(i); o.textContent = `${i + 1}. ${TITLES[p.id]}`; pick.append(o); });
function label() {
  if (current < 0) { hereN.textContent = `${POSTERS.length} poster`; hereT.textContent = 'Corridoio'; }
  else { hereN.textContent = `${current + 1} / ${POSTERS.length}`; hereT.textContent = TITLES[POSTERS[current].id]; }
  roomBtn.setAttribute('aria-pressed', String(current < 0));
  pick.value = current < 0 ? '' : String(current);
}
// after free movement the navigator follows the poster you are closest to and facing
function follow() {
  if (anim) return;
  let best = -1, bd = 1e9;
  POSTERS.forEach((p, i) => { const d = Math.hypot(pos.x - p.x, pos.z); if (d < 2600 && d < bd) { bd = d; best = i; } });
  if (best !== current) { current = best; label(); }
}
const step = k => { hideHintSoon(); if (current < 0) { const c = nearestAhead(k); goPoster(c); } else goPoster(current + k); };
function nearestAhead(k) {                                                       // from the overview: first poster in that direction along the corridor
  const order = POSTERS.map((p, i) => [p.x, i]).sort((a, b) => b[0] - a[0]);
  return k > 0 ? order[0][1] : order[order.length - 1][1];
}
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));
document.getElementById('here').addEventListener('click', () => { hideHintSoon(); current < 0 ? goPoster(1) : goPoster(current); });
pick.addEventListener('change', () => { hideHintSoon(); if (pick.value !== '') goPoster(+pick.value); pick.blur(); });
roomBtn.addEventListener('click', () => { hideHintSoon(); overview(); });
// poster format: Nielsen 70×100 (scaled print) or A0 at full size
function setSize(k, keepView) {
  if (!SIZES[k]) return; SIZE = k; OW = SIZES[k].OW; OH = SIZES[k].OH;
  for (const p of POSTERS) { for (const g of Object.values(p.sub)) p.G.remove(g); p.G.add(p.sub[k]); }
  document.getElementById('size-t').textContent = SIZES[k].title;
  document.getElementById('size-s').textContent = 'corridoio 30 × 2,4 m · ' + SIZES[k].sub;
  for (const id of ['f70', 'a0']) document.getElementById('s-' + id).setAttribute('aria-pressed', String(id === k));
  try { localStorage.setItem('poster-size', k); } catch (e) {}
  if (keepView && current >= 0) goPoster(current);
}
document.getElementById('s-f70').addEventListener('click', () => setSize('f70', true));
document.getElementById('s-a0').addEventListener('click', () => setSize('a0', true));
setSize(SIZE);
const userMoved = () => { if (anim) { goal.copy(pos); gYaw = yaw; gPitch = pitch; anim = null; } };

// what is under a screen point
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hitAt(cx, cy) {
  const rc = canvas.getBoundingClientRect(); ndc.set((cx - rc.left) / rc.width * 2 - 1, -(cy - rc.top) / rc.height * 2 + 1);
  cam.updateMatrixWorld(); ray.setFromCamera(ndc, cam);
  return ray.intersectObjects(scene.children, true).find(h => h.object.isMesh && h.face) || null;
}
// move along the ray through a screen point: f > 0 towards the surface (never closer than 7 cm), f < 0 away
function dolly(cx, cy, f) {
  userMoved();
  const h = hitAt(cx, cy), d = h ? h.distance : 4000, dir = ray.ray.direction.clone();
  goal.addScaledVector(dir, f > 0 ? Math.min(f * d, Math.max(0, d - 70)) : f * Math.max(d, 700)); clampP(goal);
}
// click or tap: on a poster, first stand in front of it, then a closer look at the clicked spot; on the floor walk there;
// on a wall or door stand 1.3 m off it
function goThere(cx, cy) {
  const h = hitAt(cx, cy); if (!h) return;
  const n = h.face.normal.clone().transformDirection(h.object.matrixWorld);
  let poster = null; for (let o = h.object; o; o = o.parent) if (o.userData.poster) poster = o;
  if (poster) {
    const i = POSTERS.findIndex(p => p.G === poster), p = POSTERS[i];
    const inFront = Math.abs(pos.x - p.x) < 400 && pos.z < frontDist() + 150 && Math.abs(Math.sin(yaw)) < 0.35;
    if (!inFront) { goPoster(i); return; }
    current = i; label();
    const d = clamp(h.distance * 0.45, 260, 900);
    flyTo(new THREE.Vector3(h.point.x, h.point.y, d), new THREE.Vector3(h.point.x, h.point.y, 0)); return;
  }
  if (n.y > 0.7) { const p = new THREE.Vector3(h.point.x, 1600, h.point.z); flyTo(p, p.clone().add(new THREE.Vector3(-Math.sin(gYaw) * 1000, 0, -Math.cos(gYaw) * 1000))); return; }
  if (n.y < -0.7) return;
  const p = h.point.clone().addScaledVector(n, 1300); p.y = clamp(h.point.y, 1450, 1750);
  flyTo(p, h.point);
}

// pointer input: drag = look, right/shift-drag = sidestep, pinch = move, two-finger drag = sidestep, click/tap = go
const pts = new Map(); let mode = null, last = null, pinch = null, press0 = null;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  hideHintSoon();
  if (pts.size === 1) {
    mode = (e.button === 2 || e.shiftKey) ? 'pan' : 'look'; last = { x: e.clientX, y: e.clientY }; panScale(e.clientX, e.clientY);
    press0 = (e.button === 0) ? { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 } : null;
  }
  if (pts.size === 2) { mode = 'pinch'; pinch = pinchState(); panScale(pinch.mx, pinch.my); press0 = null; }
});
let pscale = 1;
function panScale(cx, cy) { const h = hitAt(cx, cy), d = h ? h.distance : 3000; pscale = d * 2 * Math.tan(cam.fov * Math.PI / 360) / canvas.clientHeight; }
function pinchState() { const [a, b] = [...pts.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; }
function pan(dx, dy) {
  userMoved();
  const right = new THREE.Vector3(Math.cos(gYaw), 0, -Math.sin(gYaw));
  goal.addScaledVector(right, -dx * pscale); goal.y += dy * pscale; clampP(goal);
}
canvas.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (mode === 'look' || mode === 'pan') {
    const dx = e.clientX - last.x, dy = e.clientY - last.y; last = { x: e.clientX, y: e.clientY };
    if (press0) press0.moved += Math.abs(dx) + Math.abs(dy);
    if (press0 && press0.moved < 8) return;                                     // still a click
    if (mode === 'pan') { pan(dx, dy); return; }
    userMoved();
    const k = cam.fov * Math.PI / 180 / canvas.clientHeight;                   // the scene follows the pointer
    gYaw += dx * k; gPitch = clamp(gPitch + dy * k, -1.25, 1.25);
  } else if (mode === 'pinch' && pts.size === 2) {
    const s = pinchState();
    dolly(s.mx, s.my, Math.log(s.d / pinch.d) * 1.6);
    pan(s.mx - pinch.mx, s.my - pinch.my);
    pinch = s;
  }
});
const up = e => {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (e.type === 'pointerup' && pts.size === 0 && press0 && press0.moved < 8 && performance.now() - press0.t < 450 && mode === 'look') goThere(e.clientX, e.clientY);
  press0 = null;
  if (pts.size === 1) { mode = 'look'; const [p] = pts.values(); last = { ...p }; }
  if (pts.size === 0) mode = null;
};
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
canvas.addEventListener('wheel', e => {
  e.preventDefault(); hideHintSoon();
  const dy = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
  dolly(e.clientX, e.clientY, clamp(-dy * 0.0016, -0.45, 0.4));
}, { passive: false });
// keyboard: WASD / arrows walk and turn (shift = faster); N, P, PageDown, PageUp = next / previous poster; Home = corridor
const keys = new Set();
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('select')) return;
  if (e.code === 'KeyN' || e.code === 'PageDown') { e.preventDefault(); step(1); return; }
  if (e.code === 'KeyP' || e.code === 'PageUp') { e.preventDefault(); step(-1); return; }
  if (e.code === 'Home') { e.preventDefault(); overview(); return; }
  if (/^(Key[WASD]|Arrow\w+|ShiftLeft|ShiftRight)$/.test(e.code)) { keys.add(e.code); if (e.code !== 'ShiftLeft' && e.code !== 'ShiftRight') { e.preventDefault(); userMoved(); hideHintSoon(); } }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

const hint = document.querySelector('.hint');
hint.textContent = TOUCH
  ? 'Tocca un poster per andarci, toccalo ancora per avvicinarti · un dito: guardati intorno · pizzica: avanza · ‹ › poster vicino'
  : 'Clic su un poster per andarci, ancora per avvicinarti · trascina: guardati intorno · rotella: avanza verso il cursore · WASD o frecce: cammina · N/P: poster';
let hintTimer = null; function hideHintSoon() { if (!hintTimer) hintTimer = setTimeout(() => hint.classList.add('gone'), 9000); }

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  r.setSize(w, h, false); cam.aspect = w / h; cam.fov = w / h < 0.9 ? 62 : 42; cam.updateProjectionMatrix();
}
addEventListener('resize', resize);


resize(); overview(true);
let lastT = performance.now(), lodT = 1;
const fwd = new THREE.Vector3(), side = new THREE.Vector3();
r.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (anim) {
    const k = Math.min(1, (now - anim.s) / anim.d), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    pos.lerpVectors(anim.p0, anim.p1, e); yaw = anim.y0 + (anim.y1 - anim.y0) * e; pitch = anim.q0 + (anim.q1 - anim.q0) * e;
    if (k === 1) { goal.copy(pos); gYaw = yaw; gPitch = pitch; anim = null; }
  } else {
    if (keys.size) {
      const sp = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 4500 : 1800) * dt;
      fwd.set(-Math.sin(gYaw), 0, -Math.cos(gYaw)); side.set(Math.cos(gYaw), 0, -Math.sin(gYaw));
      if (keys.has('KeyW') || keys.has('ArrowUp')) goal.addScaledVector(fwd, sp);
      if (keys.has('KeyS') || keys.has('ArrowDown')) goal.addScaledVector(fwd, -sp);
      if (keys.has('KeyD')) goal.addScaledVector(side, sp);
      if (keys.has('KeyA')) goal.addScaledVector(side, -sp);
      if (keys.has('ArrowLeft')) gYaw += 1.5 * dt;
      if (keys.has('ArrowRight')) gYaw -= 1.5 * dt;
      clampP(goal);
    }
    const a = 1 - Math.exp(-dt * 12);
    pos.lerp(goal, a); yaw += (gYaw - yaw) * a; pitch += (gPitch - pitch) * a;
  }
  cam.position.copy(pos); cam.rotation.set(pitch, yaw, 0);
  if ((lodT += dt) > 0.3) { lodT = 0; levelOfDetail(); follow(); }
  r.render(scene, cam);
});
</script>
