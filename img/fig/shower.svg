<title id="fig-shower-t">Longitudinal profile of an electromagnetic shower in a misaligned and in an aligned crystal</title><desc id="fig-shower-d">Energy deposited per unit depth against depth, for the same high-energy electron, positron or photon. In the misaligned crystal the curve rises slowly and peaks deep inside. In the crystal aligned with the beam it peaks much earlier and falls to zero within a shorter depth. The two curves enclose the same area, the same energy.</desc>
