<title id="fig-laue-t">Principle of a Laue lens</title><desc id="fig-laue-d">Parallel γ rays from a distant source reach crystals arranged on concentric rings. Each crystal diffracts the photons by twice the Bragg angle towards a common focus on the lens axis, where a small detector sits.</desc>
