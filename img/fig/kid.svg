<title id="fig-kid-t">A phonon-mediated kinetic inductance detector array</title><desc id="fig-kid-d">Left: a silicon wafer carved into cubes that stay joined to a thin common disk; superconducting resonators on the disk sit under each cube. A particle hits one cube and the phonons it creates reach the resonator. Right: the resonance dip in microwave transmission moves to lower frequency after the hit.</desc>
