<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Crystals for Mu2e, A0 poster of the Crystal Lab Ferrara, shown in 3D in a 70×100 cm black aluminium frame.">
<title>Mu2e Poster in Frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: the 3D room fills the screen; one quiet control strip floats at the top, a hint line at the bottom. */
:root {
  --panel: rgba(255, 255, 255, .86);
  --ink: #1b1d22;
  --muted: #5b6474;
  --line: rgba(27, 29, 34, .14);
  --accent: #d62b25;
  --room: #eeeeec;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --panel: rgba(22, 24, 28, .84); --ink: #eef0f3; --muted: #a3abb8; --line: rgba(238, 240, 243, .16); color-scheme: dark } }
:root[data-theme="dark"] { --panel: rgba(22, 24, 28, .84); --ink: #eef0f3; --muted: #a3abb8; --line: rgba(238, 240, 243, .16); color-scheme: dark }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--room); color: var(--ink); font-family: var(--sans); overflow: hidden; }
#stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }
.bar {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  max-width: 980px; margin-inline: auto;
}
.id { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 260px; }
.id b { font-weight: 600; font-size: 15px; letter-spacing: .01em; }
.id b i { font-style: normal; color: var(--accent); }
.id span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.views { display: flex; flex-wrap: wrap; gap: 6px; }
.views button {
  font: 600 13px var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 7px 12px; cursor: pointer;
}
.views button:hover { border-color: var(--ink); }
.views button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.views button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint {
  position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  font-size: 12.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; white-space: nowrap;
  max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
}
#msg { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: var(--muted); pointer-events: none; }
</style>
</head>
<body>
<canvas id="stage" aria-label="3D view of the Crystals for Mu2e poster in a black aluminium frame on a white wall"></canvas>
<div id="msg">Caricamento della scena…</div>
<div class="bar">
  <div class="id">
    <b>Crystals for Mu2e <i>·</i> Nielsen Accent 70 × 100</b>
    <span>corridoio 30 × 3 m · alluminio nero satinato · A0 scalato a 70,7 × 100 cm</span>
  </div>
  <div class="views" role="group" aria-label="Viste">
    <button type="button" id="v-room" data-view="room" aria-pressed="true">Corridoio</button>
    <button type="button" id="v-near" data-view="near">Vicino</button>
    <button type="button" id="v-front" data-view="front">Fronte</button>
    <button type="button" id="v-corner" data-view="corner">Angolo</button>
    <button type="button" id="v-text" data-view="text">Testo</button>
  </div>
</div>
<div class="hint">Trascina per ruotare · rotella o pizzico per zoomare · tasto destro o due dita per spostare</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('stage'), msg = document.getElementById('msg');
const r = new THREE.WebGLRenderer({ canvas, antialias: true });
// 8192 px texture on desktops (text readable at close range), 4096 px on phones and small GPUs
const TEX = matchMedia('(pointer: coarse)').matches || r.capabilities.maxTextureSize < 8192 ? 'poster-4k.jpg' : 'poster-8k.jpg';
r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.NeutralToneMapping; r.toneMappingExposure = 1.0;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2f2f0);
const pm = new THREE.PMREMGenerator(r);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

// units: mm. Poster wall = plane z = 0, floor y = 0, poster centre 1500 mm above the floor.
const CY = 1500;
let seed = 11; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
function noiseTex(n, amp, rep) {
  const c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d'), d = g.createImageData(n, n);
  for (let i = 0; i < n * n; i++) { const v = 128 + (rnd() - 0.5) * amp; d.data[4 * i] = d.data[4 * i + 1] = d.data[4 * i + 2] = v; d.data[4 * i + 3] = 255; }
  g.putImageData(d, 0, 0); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); return t;
}
// Corridor 30 m × 3 m, ceiling 3 m (height assumed). Axis along x; the poster wall is z = 0 (the right-hand wall walking in
// from the entrance at x = +6 m), the opposite wall z = 3000. Right wall: standard doors every 3 m, centred 1.5, 4.5, 7.5 … m
// from the entrance; the poster hangs at x = 0, halfway between the 2nd and the 3rd. Left wall: fire doors every 6 m (3, 9, 15 … m).
const XE = 6000, XF = XE - 30000, CW = 3000, CH = 3000, XM = (XE + XF) / 2;
const white = new THREE.MeshStandardMaterial({ color: 0xf6f6f4, roughness: 0.95, bumpMap: noiseTex(512, 50, 60), bumpScale: 0.3 });
const plane = (w, h, mat, pos, rot) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(...pos); m.rotation.set(...rot); m.receiveShadow = true; scene.add(m); return m; };
plane(30000, CH, white, [XM, CH / 2, 0], [0, 0, 0]);                       // right wall (poster)
plane(30000, CH, white, [XM, CH / 2, CW], [0, Math.PI, 0]);                // left wall
plane(CW, CH, white, [XE, CH / 2, CW / 2], [0, -Math.PI / 2, 0]);          // entrance end
plane(CW, CH, white, [XF, CH / 2, CW / 2], [0, Math.PI / 2, 0]);           // far end
plane(30000, CW, new THREE.MeshStandardMaterial({ color: 0xf8f8f6, roughness: 0.95 }), [XM, CH, CW / 2], [Math.PI / 2, 0, 0]);   // ceiling
// grey porcelain floor, 300 mm tiles, 2 mm grout; one texture repeat = 8 × 8 tiles
{
  const N = 8, T = 128, c = document.createElement('canvas'); c.width = c.height = N * T; const g = c.getContext('2d');
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const l = 55 + (rnd() - 0.5) * 1.4; g.fillStyle = `hsl(210,3%,${l}%)`; g.fillRect(i * T, j * T, T, T);
    for (let q = 0; q < 260; q++) { g.fillStyle = `hsla(210,4%,${l + (rnd() - 0.5) * 22}%,.5)`; g.fillRect(i * T + rnd() * T, j * T + rnd() * T, 1 + rnd() * 1.5, 1 + rnd() * 1.5); }
  }
  g.fillStyle = 'hsl(210,3%,42%)'; for (let k = 0; k < N; k++) { g.fillRect(k * T, 0, 1.5, N * T); g.fillRect(0, k * T, N * T, 1.5); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30000 / 2400, CW / 2400); t.anisotropy = 16;
  const floor = plane(30000, CW, new THREE.MeshStandardMaterial({ map: t, roughness: 0.32, envMapIntensity: 0.5 }), [XM, 0, CW / 2], [-Math.PI / 2, 0, 0]);
  floor.material.map.offset.set(0, 0);
}
// doors: painted yellow steel, metal handles
const yellow = new THREE.MeshStandardMaterial({ color: 0xf0b31a, roughness: 0.42 });
const yellowFrame = new THREE.MeshStandardMaterial({ color: 0xe2a512, roughness: 0.5 });
const steel = new THREE.MeshStandardMaterial({ color: 0xb8bcc2, metalness: 0.9, roughness: 0.32 });
const darkSteel = new THREE.MeshStandardMaterial({ color: 0x4a4e55, metalness: 0.7, roughness: 0.45 });
const box = (grp, w, h, d, mat, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; grp.add(m); return m; };
// a door in a group whose local wall is z = 0 facing +z; returns its outer width (for the skirting)
function door(x, z, rotY, fire) {
  const grp = new THREE.Group(); grp.position.set(x, 0, z); grp.rotation.y = rotY; scene.add(grp);
  const W = fire ? 1200 : 900, H = fire ? 2150 : 2100, F = fire ? 60 : 50;
  box(grp, F, H + F, 20, yellowFrame, -W / 2 - F / 2, (H + F) / 2, 10);           // jambs and head
  box(grp, F, H + F, 20, yellowFrame, W / 2 + F / 2, (H + F) / 2, 10);
  box(grp, W + 2 * F, F, 20, yellowFrame, 0, H + F / 2, 10);
  box(grp, W - 4, H - 6, fire ? 8 : 6, yellow, 0, H / 2, fire ? 4 : 3);           // leaf, nearly flush
  if (fire) {
    box(grp, W - 160, 40, 30, darkSteel, 0, 1000, 48);                            // panic bar on two brackets
    box(grp, 40, 70, 40, darkSteel, -W / 2 + 100, 1000, 25); box(grp, 40, 70, 40, darkSteel, W / 2 - 100, 1000, 25);
    box(grp, 320, 55, 55, steel, -W / 2 + 230, H - 70, 33);                       // overhead door closer
    box(grp, 220, 12, 14, steel, -W / 2 + 330, H - 85, 66);
    const sign = box(grp, 200, 200, 2, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }), 0, 1650, 9);   // "keep closed" plate
    box(grp, 170, 20, 2.5, new THREE.MeshStandardMaterial({ color: 0xc8231d, roughness: 0.6 }), 0, 1720, 9.5);
  } else {
    box(grp, 50, 130, 12, steel, W / 2 - 75, 1050, 11);                           // rosette, lever, key plate
    const lever = box(grp, 130, 18, 18, steel, W / 2 - 125, 1080, 35);
    box(grp, 18, 18, 30, steel, W / 2 - 70, 1080, 20);
    box(grp, 120, 50, 3, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }), W / 2 + 230, 1550, 2);   // room-number plate
  }
  return W + 2 * F;
}
const rightDoors = [...Array(10)].map((_, k) => XE - 1500 - 3000 * k);           // 4500, 1500, -1500, …
const leftDoors = [...Array(5)].map((_, k) => XE - 3000 - 6000 * k);              // 3000, -3000, …
rightDoors.forEach(x => door(x, 0, 0, false));
leftDoors.forEach(x => door(x, CW, Math.PI, true));
// skirting in grey porcelain, 80 mm, broken at the doors
const skirtMat = new THREE.MeshStandardMaterial({ color: 0x8b8e91, roughness: 0.4 });
function skirting(z, doors, half) {
  const cuts = doors.map(x => [x - half, x + half]).sort((a, b) => a[0] - b[0]);
  let x0 = XF; for (const [a, b] of [...cuts, [XE, XE]]) { if (a > x0) { const m = new THREE.Mesh(new THREE.BoxGeometry(a - x0, 80, 9), skirtMat); m.position.set((a + x0) / 2, 40, z); m.receiveShadow = true; scene.add(m); } x0 = b; }
}
skirting(4.5, rightDoors, 500); skirting(CW - 4.5, leftDoors, 660);
// surface-mounted LED panels 600 × 600 on the centre line, every 3 m (aligned with the right-hand doors)
const panelX = rightDoors;
const lamps = [];
for (const x of panelX) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(620, 45, 620), new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.5 })); m.position.set(x, CH - 22, CW / 2); scene.add(m);
  const d = new THREE.Mesh(new THREE.PlaneGeometry(590, 590), new THREE.MeshBasicMaterial({ color: 0xffffff })); d.rotation.x = Math.PI / 2; d.position.set(x, CH - 45.5, CW / 2); scene.add(d);
  const L = new THREE.SpotLight(0xfff8f0, 6.5e6, 0, Math.PI / 2.15, 1, 2); L.position.set(x, CH - 50, CW / 2); L.target.position.set(x, 0, CW / 2); scene.add(L, L.target);
  if (Math.abs(x) < 2000) { L.castShadow = true; L.shadow.mapSize.set(2048, 2048); L.shadow.bias = -0.0002; L.shadow.normalBias = 0.8; L.shadow.radius = 4; L.shadow.focus = 0.75; L.shadow.camera.near = 200; L.shadow.camera.far = 8000; }
  lamps.push(L);
}
// frame: Nielsen Accent 70×100, face 7.8 mm, depth 18 mm, lip over the print 5 mm, hangs 4 mm off the wall
const PW = 700, PH = 1000, LIP = 5, FACE = 7.8, DEPTH = 18, GAP = 4;
const OW = PW - 2 * LIP + 2 * FACE, OH = PH - 2 * LIP + 2 * FACE, IW = PW - 2 * LIP, IH = PH - 2 * LIP;
const frameMat = new THREE.MeshPhysicalMaterial({ color: 0x1c1d20, metalness: 0.55, roughness: 0.42, clearcoat: 0.25, clearcoatRoughness: 0.5, bumpMap: noiseTex(256, 30, 40), bumpScale: 0.05 });
const G = new THREE.Group(); G.position.set(0, CY, GAP); scene.add(G);
{
  const s = new THREE.Shape(); s.moveTo(-OW / 2, -OH / 2); s.lineTo(OW / 2, -OH / 2); s.lineTo(OW / 2, OH / 2); s.lineTo(-OW / 2, OH / 2); s.closePath();
  const h = new THREE.Path(); h.moveTo(-IW / 2, -IH / 2); h.lineTo(-IW / 2, IH / 2); h.lineTo(IW / 2, IH / 2); h.lineTo(IW / 2, -IH / 2); h.closePath(); s.holes.push(h);
  const geo = new THREE.ExtrudeGeometry(s, { depth: DEPTH - 1.2, bevelEnabled: true, bevelThickness: 0.6, bevelSize: 0.6, bevelSegments: 4, curveSegments: 1 });
  const m = new THREE.Mesh(geo, frameMat); m.position.z = 0.6; m.castShadow = m.receiveShadow = true; G.add(m);
  const seamMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
  for (const [sx, sy] of [[1, 1], [-1, 1], [1, -1], [-1, -1]]) {   // mitre joints
    const seam = new THREE.Mesh(new THREE.PlaneGeometry(Math.hypot(FACE, FACE) + 0.4, 0.25), seamMat);
    seam.position.set(sx * (OW / 2 - FACE / 2), sy * (OH / 2 - FACE / 2), DEPTH + 0.62); seam.rotation.z = sx * sy > 0 ? Math.PI / 4 : -Math.PI / 4; G.add(seam);
  }
}
const back = new THREE.Mesh(new THREE.BoxGeometry(PW, PH, DEPTH - 6), new THREE.MeshStandardMaterial({ color: 0x8a7a64, roughness: 1 }));
back.position.z = (DEPTH - 6) / 2 - 0.5; back.castShadow = true; G.add(back);
const glass = new THREE.Mesh(new THREE.PlaneGeometry(PW, PH), new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.03, transparent: true, opacity: 0.08, envMapIntensity: 1.6, depthWrite: false }));
glass.position.z = DEPTH - 2.5; G.add(glass);
// fill: diffuse light bounced by the white walls and ceiling
scene.add(new THREE.HemisphereLight(0xffffff, 0xd4d6d8, 0.75));
// camera and controls
const cam = new THREE.PerspectiveCamera(35, 1, 5, 40000);
const ctl = new OrbitControls(cam, canvas);
Object.assign(ctl, { enableDamping: true, dampingFactor: 0.08, zoomToCursor: true, minDistance: 90, maxDistance: 26000, minPolarAngle: 0.2, maxPolarAngle: 2.2, screenSpacePanning: true });
const VIEWS = {
  room:   { pos: [XE - 300, 1650, 2150],                 tgt: [0, 1480, 0] },
  near:   { pos: [1750, 1600, 2500],                     tgt: [0, 1480, 0] },
  front:  { pos: [0, CY, 2900],                          tgt: [0, CY, 0] },
  corner: { pos: [OW / 2 + 230, CY + OH / 2 + 110, 300], tgt: [OW / 2 - 60, CY + OH / 2 - 80, DEPTH] },
  text:   { pos: [-120, CY + 300, 640],                  tgt: [-120, CY + 300, DEPTH] },
};
const clampAll = () => {                                   // pivot and camera stay inside the corridor
  const t = ctl.target, p = cam.position;
  t.x = Math.max(XF + 500, Math.min(XE - 500, t.x)); t.y = Math.max(200, Math.min(CH - 200, t.y)); t.z = Math.max(0, Math.min(CW - 200, t.z));
  p.x = Math.max(XF + 150, Math.min(XE - 150, p.x)); p.y = Math.max(150, Math.min(CH - 120, p.y)); p.z = Math.max(60, Math.min(CW - 60, p.z));
};
ctl.addEventListener("change", clampAll);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let anim = null;
function go(name, instant) {
  const v = VIEWS[name]; if (!v) return;
  document.querySelectorAll('.views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  const p1 = new THREE.Vector3(...v.pos), t1 = new THREE.Vector3(...v.tgt);
  if (instant || reduce) { cam.position.copy(p1); ctl.target.copy(t1); ctl.update(); anim = null; return; }
  anim = { p0: cam.position.clone(), t0: ctl.target.clone(), p1, t1, s: performance.now(), d: 900 };
}
document.querySelectorAll('.views button').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
ctl.addEventListener('start', () => { anim = null; document.querySelectorAll('.views button').forEach(b => b.setAttribute('aria-pressed', 'false')); });

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  r.setSize(w, h, false); cam.aspect = w / h; cam.fov = w / h < 0.9 ? 60 : 42; cam.updateProjectionMatrix();
}
addEventListener('resize', resize);

// the print: A0 scaled to 1000 mm high, centred; the frame lip covers the edges
const img = new Image(); img.src = TEX;
img.decode().then(() => {
  const tex = new THREE.Texture(img); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = r.capabilities.getMaxAnisotropy(); tex.needsUpdate = true;
  const print = new THREE.Mesh(new THREE.PlaneGeometry(PH * img.width / img.height, PH), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8, envMapIntensity: 0.5 }));
  print.position.z = DEPTH - 5; print.receiveShadow = true; G.add(print);
  msg.hidden = true;
  window.__ready = true;
}).catch(() => { msg.textContent = 'Immagine del poster non caricata: ricarica la pagina.'; });

resize(); go('room', true);
r.setAnimationLoop(now => {
  if (anim) {
    const k = Math.min(1, (now - anim.s) / anim.d), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    cam.position.lerpVectors(anim.p0, anim.p1, e); ctl.target.lerpVectors(anim.t0, anim.t1, e);
    if (k === 1) anim = null;
  }
  ctl.update(); r.render(scene, cam);
});
</script>
</body>
