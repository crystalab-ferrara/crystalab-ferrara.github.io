<title id="fig-pos-t">Three ways to make positrons from an electron beam</title><desc id="fig-pos-d">Top: electrons hit a thick amorphous tungsten target and produce positrons, with a lot of heat. Middle, hybrid scheme: a thin oriented tungsten crystal radiates photons, and an amorphous target downstream converts them into positrons. Bottom: a single thick oriented crystal both radiates and converts.</desc>
